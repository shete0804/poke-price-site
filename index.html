<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポケカ最安値比較</title>
<style>
:root {
  --bg: #f5f4f0; --paper: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --rule: #dcdad2;
  --paypay: #b84a12; --mercari: #0c6b63; --best: #1f7a3a; --gap: #9a2b2b;
  --sans: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --paper: #22221f; --ink: #ecebe6; --muted: #9c9a92; --rule: #3a3a35;
    --paypay: #f0875a; --mercari: #4fc3b5; --best: #6fd58c; --gap: #ef8a8a; color-scheme: dark;
  }
}
/* iPhone の Chrome / Safari が文字を勝手に大きくして右が切れるのを防ぐ */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 14px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
main { max-width: 880px; margin: 0 auto; min-width: 0; overflow-wrap: anywhere; }
h1 { font-size: 22px; margin: 0 0 4px; text-wrap: balance; }
.lede { color: var(--muted); margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 14px 0 20px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.card { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
.card h2 { font-size: 16px; margin: 0 0 10px; }
.sites { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; min-width: 0; }
@media (max-width: 560px) { .sites { grid-template-columns: 1fr; gap: 10px; } }
.site { min-width: 0; }
.site-name { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; margin: 0 0 4px; }
.site.paypay .site-name { color: var(--paypay); }
.site.mercari .site-name { color: var(--mercari); }
.site-link { color: inherit; text-decoration: none; border-bottom: 1px solid currentColor; }
.site-link::after { content: " ↗"; font-weight: 400; }
ol { list-style: none; margin: 0; padding: 0; }
li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; padding: 3px 0; border-top: 1px dashed var(--rule); font-variant-numeric: tabular-nums; }
li:first-child { border-top: none; }
li.excluded { opacity: 0.45; }
li.excluded .price a { text-decoration: line-through; }
.rank { color: var(--muted); min-width: 2.6em; font-size: 12px; white-space: nowrap; }
.thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; flex: none; background: var(--rule); }
.price { font-weight: 700; white-space: nowrap; }
.price a { color: inherit; text-decoration: none; border-bottom: 1px solid currentColor; }
.best .price { color: var(--best); }
.best .price::after { content: " 最安"; font-size: 11px; font-weight: 700; margin-left: 4px; }
.empty { color: var(--muted); font-size: 13px; margin: 0; }
/* 出品の行の下、右側に「写真を作る」と「除外」をそろえる */
.actions { flex: 1 1 100%; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.photo-btn { font-size: 12px; padding: 2px 10px; border: 1px solid var(--mercari); color: var(--mercari); border-radius: 999px; text-decoration: none; white-space: nowrap; }
.exclude-btn { font: inherit; font-size: 12px; padding: 2px 10px; white-space: nowrap; border: 1px solid var(--rule); border-radius: 999px; background: var(--paper); color: var(--muted); cursor: pointer; }
.exclude-btn[aria-pressed="true"] { border-color: var(--gap); color: var(--gap); }
/* チェック：確認した出品の目印（押すたびに付く・外れる）。売り切れて一覧から消えると、自動で消える */
.check-btn { font: inherit; font-size: 12px; padding: 2px 10px; white-space: nowrap; border: 1px solid var(--rule); border-radius: 999px; background: var(--paper); color: var(--muted); cursor: pointer; }
.check-btn[aria-pressed="true"] { border-color: var(--best); background: var(--best); color: var(--paper); font-weight: 700; }
li.checked { box-shadow: inset 3px 0 0 var(--best); padding-left: 8px; }
.rank-check { font: inherit; font-size: 14px; line-height: 1; width: 28px; height: 28px; padding: 0; flex: none; align-self: center; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); color: var(--rule); cursor: pointer; }
.rank-check[aria-pressed="true"] { border-color: var(--best); background: var(--best); color: var(--paper); font-weight: 700; }
.gap-list li.rank-checked { opacity: 0.6; }
.gap-list { list-style: none; margin: 0; padding: 0; }
.gap-list li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 6px 0; border-top: 1px dashed var(--rule); }
.gap-list li:first-child { border-top: none; }
.gap-list a { color: var(--ink); font-weight: 700; text-decoration: none; }
.gap-list a:hover { text-decoration: underline; }
.gap-diff { color: var(--gap); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 6em; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; padding: 8px 0; position: sticky; top: 0; z-index: 10; background: var(--bg); }
.tab { font: inherit; padding: 6px 14px; border: 1px solid var(--rule); border-radius: 999px; background: var(--paper); color: var(--ink); cursor: pointer; }
.updated-top { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
.rank-filter { margin: 0 0 10px; }
.rank-filter button { font: inherit; font-size: 13px; padding: 4px 12px; border: 1px solid var(--rule); border-radius: 999px; background: var(--paper); color: var(--ink); cursor: pointer; }
.rank-filter button[aria-pressed="true"] { background: var(--best); border-color: var(--best); color: var(--paper); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.gap-detail { flex: 1 1 100%; min-width: 0; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
th, td { padding: 5px 6px; border-top: 1px dashed var(--rule); text-align: left; }
th { color: var(--muted); font-weight: 600; border-top: none; }
td.num, th.num { text-align: right; }
td.value { font-weight: 700; }
.table-wrap { overflow-x: auto; }
.sub { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
footer { margin-top: 20px; color: var(--muted); font-size: 12px; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.reload { margin-left: auto; font: inherit; font-size: 14px; padding: 6px 14px; min-height: 44px; border: 1px solid var(--rule); border-radius: 999px; background: var(--paper); color: var(--ink); cursor: pointer; }
@media (max-width: 560px) { .reload { font-size: 13px; padding: 5px 12px; min-height: 0; } }
/* スマホ：全体の文字と余白を大きくする（PC の見た目は変えない） */
@media (max-width: 560px) {
  body { font-size: 16px; }
  h1 { font-size: 26px; }
  .legend { font-size: 15px; }
  .card { padding: 16px; }
  .card h2 { font-size: 19px; }
  .site-name { font-size: 14px; }
  .rank { font-size: 13px; min-width: 0; }
  li { padding: 6px 0; }
  .thumb { width: 56px; height: 56px; }
  .actions { flex: none; flex-direction: column; align-items: flex-end; align-self: flex-start; gap: 4px; margin-left: auto; }
  .photo-btn, .exclude-btn, .check-btn { font-size: 11px; padding: 2px 8px; }
  .empty { font-size: 15px; }
  .gap-list li { padding: 10px 0; }
  .gap-diff { min-width: 0; }
  .gap-detail { font-size: 14px; }
  .tab { font-size: 13px; padding: 5px 12px; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>ポケカ最安値 PayPayとメルカリ</h1>
  </header>
  <p id="updated" class="updated-top" hidden></p>
  <nav id="tabs" class="tabs" hidden>
    <button type="button" class="tab" data-tab="ranking" aria-selected="true">差額ランキング</button>
    <button type="button" class="tab" data-tab="cards" aria-selected="false">カード別</button>
    <button type="button" class="reload" onclick="location.reload()">↻ 再読み込み</button>
  </nav>
  <form id="gate" class="card" hidden>
    <label for="pw">パスワード</label>
    <p><input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit">開く</button></p>
    <p id="gate-msg" class="empty" hidden>パスワードが違います。</p>
  </form>
  <div id="cards" hidden><p class="empty">結果を読み込んでいます…</p></div>
  <footer id="sync" hidden></footer>
</main>
<script>
// 開いたら必ず一番上から表示する（前回のスクロール位置は覚えない）
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
window.scrollTo(0, 0);

// 簡易的な入口のパスワード（ハッシュだけを置く）。CSV は公開のままなので本当の保護ではない
const PW_HASH = "224948ca810fc2bc9e3d80c0b1129fe2487fa4e307961001ab8443db82f7bb69";

async function sha256hex(text) {
  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, "0")).join("");
}

document.getElementById("gate").addEventListener("submit", async e => {
  e.preventDefault();
  const input = document.getElementById("pw").value;
  if (await sha256hex(input) === PW_HASH) {
    document.getElementById("gate").hidden = true;
    document.getElementById("cards").hidden = false;
    document.getElementById("updated").hidden = false;
    load().catch(showError);
  } else {
    document.getElementById("gate-msg").hidden = false;
  }
});

// 定期実行が commit する CSV と、時価総額の CSV を、開いたときに読みにいく
const SOURCES = {
  paypay: "https://raw.githubusercontent.com/shete0804/paypayfleamarket-price-tracker/main/results/paypay.csv",
  mercari: "https://raw.githubusercontent.com/shete0804/mercari-scraper/main/results/mercari.csv",
  snkrdunk: "https://raw.githubusercontent.com/shete0804/poke-price-site/main/results/snkrdunk_latest.csv",
};

function parseCsv(text) {
  const lines = text.trim().split(/\r?\n/);
  const header = lines.shift().split(",");
  return lines.map(line => {
    const cells = line.split(",");
    const row = {};
    header.forEach((h, i) => { row[h] = cells[i] ?? ""; });
    return row;
  });
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

// 除外した出品は、出品ごとに URL で覚える。この端末のブラウザに保存する（閉じても残る）
const EXCLUDE_KEY = "excludedListings";
function readExcluded() {
  try { return new Set(JSON.parse(localStorage.getItem(EXCLUDE_KEY) || "[]")); } catch { return new Set(); }
}
function writeExcluded(set) {
  try { localStorage.setItem(EXCLUDE_KEY, JSON.stringify([...set])); } catch { /* 保存できなくても表示は動く */ }
}

// チェックした出品も、URL で覚える（除外とは別。チェックしても最安値の計算には影響しない）
// 保存は「URL → 最後に一覧で見えた時刻」。CSV には各サイト上位5件しか載らないので、一覧に無い＝売り切れ、とは言えない
// （もっと安い出品が増えて6位以下に落ちただけかもしれない）。だから一覧から外れてもチェックは残し、
// 45日以上一覧に見えなかったものだけを掃除する（売り切れた出品は、その頃には確実に消えている）
const CHECK_KEY = "checkedListings";
const CHECK_KEEP_DAYS = 45;
function readChecked() {
  try {
    const v = JSON.parse(localStorage.getItem(CHECK_KEY) || "{}");
    if (Array.isArray(v)) { // 前の保存形式（URL の配列）からの引き継ぎ：今の時刻を入れて、新しい形式で保存し直す
      const migrated = new Map(v.map(url => [url, Date.now()]));
      writeChecked(migrated);
      return migrated;
    }
    return new Map(Object.entries(v));
  } catch { return new Map(); }
}
function writeChecked(map) {
  try { localStorage.setItem(CHECK_KEY, JSON.stringify(Object.fromEntries(map))); } catch { /* 保存できなくても表示は動く */ }
}

// 差額ランキングのチェック：カード名で覚える。出品のチェックとは別物で、自動では一切更新・削除しない
// （押して付ける、もう一度押して外す、のときだけ変わる）
const RANK_CHECK_KEY = "rankCheckedCards";
function readRankChecked() {
  try { return new Set(JSON.parse(localStorage.getItem(RANK_CHECK_KEY) || "[]")); } catch { return new Set(); }
}
function writeRankChecked(set) {
  try { localStorage.setItem(RANK_CHECK_KEY, JSON.stringify([...set])); } catch { /* 保存できなくても表示は動く */ }
}
const rankChecked = readRankChecked();

// 出品1件の行。除外中の出品は薄く表示して、もう一度押すと取り消せる（最安値の計算からは外れる）
function siteBlock(name, cls, rows, cheapest, excluded, toggle, link) {
  const box = el("div", "site " + cls);
  // サイト名の文字は、出品の有る無しに関係なく、常にリンクにする（PayPay・メルカリ＝1個目の検索語と下限の検索ページ、SNKRDUNK＝カードのトップページ）
  const head = el("p", "site-name");
  if (link) {
    const a = el("a", "site-link", name);
    a.href = link;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    head.appendChild(a);
  } else {
    head.textContent = name;
  }
  box.appendChild(head);
  const valid = rows.filter(r => /^\d+$/.test(r["価格"]));
  if (valid.length === 0) {
    box.appendChild(el("p", "empty", rows.length ? rows[0]["価格"] : "該当なし"));
    return box;
  }
  const list = el("ol");
  for (const r of valid) {
    const price = Number(r["価格"]);
    const off = excluded.has(r["URL"]);
    const li = el("li");
    const isChecked = checked.has(r["URL"]);
    const classes = [];
    if (off) classes.push("excluded");
    else if (price === cheapest) classes.push("best");
    if (isChecked) classes.push("checked");
    if (classes.length) li.className = classes.join(" ");
    if (r["写真"]) {
      const img = el("img");
      img.src = r["写真"];
      img.alt = "";
      img.loading = "lazy";
      img.width = 56;
      img.height = 56;
      img.className = "thumb";
      li.appendChild(img);
    }
    li.appendChild(el("span", "rank", r["順位"] + "位" + (r["状態"] ? " " + r["状態"] : "")));
    const span = el("span", "price");
    const a = el("a", null, "¥" + price.toLocaleString("ja-JP"));
    a.href = r["URL"];
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    span.appendChild(a);
    li.appendChild(span);
    const actions = el("div", "actions");
    li.appendChild(actions);
    if (cls === "paypay" || cls === "mercari" || cls === "snkrdunk") {
      // 写真を作る：商品番号を入れた Issue の画面を開く（送信ボタンを押すと処理が始まる）
      // PayPay は z+商品番号、メルカリは m+商品番号、スニダンは s+商品ID-出品ID（URL の /apparels/商品ID/used/出品ID から作る）
      const id = cls === "snkrdunk"
        ? "s" + r["URL"].split("/apparels/")[1].replace("/used/", "-")
        : r["URL"].split("/").pop();
      const btn = el("a", "photo-btn", "写真を作る");
      btn.href = "https://github.com/shete0804/mercari-photo-test/issues/new?title=" + encodeURIComponent(id);
      btn.target = "_blank";
      btn.rel = "noopener noreferrer";
      actions.appendChild(btn);
    }
    const cbtn = el("button", "check-btn", isChecked ? "✓ チェック済み" : "チェック");
    cbtn.type = "button";
    cbtn.setAttribute("aria-pressed", String(isChecked));
    cbtn.addEventListener("click", () => toggleCheck(r["URL"]));
    actions.appendChild(cbtn);
    const xbtn = el("button", "exclude-btn", off ? "取り消す" : "除外");
    xbtn.type = "button";
    xbtn.setAttribute("aria-pressed", String(off));
    xbtn.addEventListener("click", () => toggle(r["URL"]));
    actions.appendChild(xbtn);
    list.appendChild(li);
  }
  box.appendChild(list);
  return box;
}

const yen = n => "¥" + Math.round(n).toLocaleString("ja-JP");

// ランキングの名前を押したとき：カード別のタブに切り替えて、そのカードまで移動する
function openCard(id) {
  document.querySelector('#tabs .tab[data-tab="cards"]').click();
  document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "start" });
}

// 差額ランキング：PayPay の最安から、メルカリ・SNKRDUNK のうち安い方の最安を引いた差（絶対値の円）が大きい順
let rankOnlyChecked = false;   // ✓ を付けたカードだけ表示（見た目の絞り込み。保存はしない）
function rankingSection(gaps) {
  const section = el("section", "card");
  const filter = el("div", "rank-filter");
  const fb = el("button", null, "✓ を付けたものだけ");
  fb.type = "button";
  fb.setAttribute("aria-pressed", String(rankOnlyChecked));
  fb.addEventListener("click", () => { rankOnlyChecked = !rankOnlyChecked; render(); });
  filter.appendChild(fb);
  section.appendChild(filter);
  const list = el("ol", "gap-list");
  gaps.forEach((g, i) => {
    if (rankOnlyChecked && !rankChecked.has(keyOf(g.card))) return;
    const li = el("li");
    const rk = keyOf(g.card);
    const on = rankChecked.has(rk);
    if (on) li.className = "rank-checked";
    const rb = el("button", "rank-check", "✓");
    rb.type = "button";
    rb.setAttribute("aria-pressed", String(on));
    rb.setAttribute("aria-label", "チェック");
    rb.addEventListener("click", () => {
      if (rankChecked.has(rk)) rankChecked.delete(rk); else rankChecked.add(rk);
      writeRankChecked(rankChecked);
      pushShared("rank", rk, rankChecked.has(rk));
      if (rankOnlyChecked) { const top = window.scrollY; render(); window.scrollTo(0, top); return; }
      rb.setAttribute("aria-pressed", String(rankChecked.has(rk)));
      li.classList.toggle("rank-checked", rankChecked.has(rk));
    });
    li.appendChild(rb);
    li.appendChild(el("span", "gap-rank", (i + 1) + "位"));
    li.appendChild(el("span", "gap-diff",(g.diff >= 0 ? "+" : "−") + yen(Math.abs(g.diff))));
    const a = el("a", null, g.card);
    a.href = "#card-" + g.idx;
    a.addEventListener("click", e => {
      e.preventDefault();
      openCard("card-" + g.idx);
    });
    li.appendChild(a);
    li.appendChild(el("span", "gap-detail", "PayPay " + yen(g.ppMin) + " ／ " + g.otherName + " " + yen(g.otherMin)));
    list.appendChild(li);
  });
  section.appendChild(list);
  return section;
}

// 表示するカード名は、CSV に入っている名前（設定ファイルの name）をそのまま使う。検索語とは分けない

// カード名の比べ方：全角・半角の違いや空白、大文字小文字を無視する（リンクの表のキーも同じ方法で作る）
const keyOf = s => s.replace(/＆/g, "&").replace(/[\s　]/g, "").toLowerCase();
let links = {};           // カードごとの検索ページ・商品ページのリンク（results/links.json。読めなくても表示は動く）
const LINKS_URL = "https://raw.githubusercontent.com/shete0804/poke-price-site/main/results/links.json";

let data = null;          // 取得した CSV（除外を変えたときに計算し直すため覚えておく）
let currentTab = "ranking";
const excluded = readExcluded();
const checked = readChecked();

// ---- 端末をまたいだ共有（除外・チェック・ランキングのチェック）----
// 共有の保存場所は、このリポジトリの state ブランチの results/state.json。GitHub のトークン（この端末だけに保存）で読み書きする。
// トークンがない端末は、今までどおりこの端末だけに保存する。
const TOKEN_KEY = "ghToken";
const STATE_API = "https://api.github.com/repos/shete0804/poke-price-site/contents/results/state.json";
const STATE_BRANCH = "state";
function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; } }
function b64enc(s) { let bin = ""; for (const b of new TextEncoder().encode(s)) bin += String.fromCharCode(b); return btoa(bin); }
function b64dec(s) { return new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0))); }
// 共有のつなぎ方・解除（上の「共有」ボタンと、ページ下の表示の両方から使う）
function shareAction() {
  if (getToken()) {
    if (confirm("この端末の共有を解除します（保存した除外・チェックはこの端末に残ります）。")) { try { localStorage.removeItem(TOKEN_KEY); } catch {} location.reload(); }
  } else {
    const t = prompt("GitHub のトークンを貼ってください（この端末のブラウザにだけ保存します）");
    if (t && t.trim()) { try { localStorage.setItem(TOKEN_KEY, t.trim()); } catch {} location.reload(); }
  }
}
function setSyncText(text, bad) {
  const f = document.getElementById("sync");
  f.hidden = false;
  f.textContent = text + " ";
  const a = el("a", null, getToken() ? "［共有を解除］" : "［この端末を共有につなぐ］");
  a.href = "#";
  a.style.color = bad ? "var(--gap)" : "inherit";
  a.addEventListener("click", e => { e.preventDefault(); shareAction(); });
  f.appendChild(a);
}
async function ghGetState() {
  const r = await fetch(`${STATE_API}?ref=${STATE_BRANCH}&t=${Date.now()}`, {
    headers: { Authorization: "Bearer " + getToken(), Accept: "application/vnd.github+json" }, cache: "no-store",
  });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error("読み込み " + r.status);
  const j = await r.json();
  return { sha: j.sha, state: JSON.parse(b64dec(j.content)) };
}
async function ghPutState(state, sha) {
  return fetch(STATE_API, {
    method: "PUT",
    headers: { Authorization: "Bearer " + getToken(), Accept: "application/vnd.github+json", "Content-Type": "application/json" },
    body: JSON.stringify({ message: "chore: update shared state", content: b64enc(JSON.stringify(state)), branch: STATE_BRANCH, ...(sha ? { sha } : {}) }),
  });
}
function currentState() {
  return { excluded: [...excluded], checked: Object.fromEntries(checked), rankChecked: [...rankChecked] };
}
function applyState(st) {
  excluded.clear(); (st.excluded || []).forEach(u => excluded.add(u));
  checked.clear(); Object.entries(st.checked || {}).forEach(([u, t]) => checked.set(u, t));
  rankChecked.clear(); (st.rankChecked || []).forEach(k => rankChecked.add(k));
  writeExcluded(excluded); writeChecked(checked); writeRankChecked(rankChecked);
}
// 共有の状態を読む。共有に何もなければ、この端末の保存を共有に上げる（初回のつなぎ）
async function pullShared() {
  if (!getToken()) { setSyncText("この端末の中だけに保存しています。"); return; }
  try {
    const cur = await ghGetState();
    const empty = !cur || (!(cur.state.excluded || []).length && !Object.keys(cur.state.checked || {}).length && !(cur.state.rankChecked || []).length);
    if (empty && (excluded.size || checked.size || rankChecked.size)) {
      const res = await ghPutState(currentState(), cur?.sha);
      if (!res.ok) throw new Error("書き込み " + res.status);
    } else if (cur) {
      applyState(cur.state);
    }
    setSyncText("除外・チェックは、トークンをつないだ端末で共通です。");
  } catch (e) {
    setSyncText("共有を読めませんでした（" + e.message + "）。この端末の保存を使っています。", true);
  }
}
// 1つの操作を共有に反映する（読み直して、その1件だけ書き換えて上げる。他の端末の操作とぶつかったらやり直す）
async function pushShared(kind, key, on) {
  if (!getToken()) return;
  try {
    for (let i = 0; i < 4; i++) {
      const cur = await ghGetState();
      const st = cur ? cur.state : { excluded: [], checked: {}, rankChecked: [] };
      st.excluded ||= []; st.checked ||= {}; st.rankChecked ||= [];
      if (kind === "excluded") { const s = new Set(st.excluded); on ? s.add(key) : s.delete(key); st.excluded = [...s]; }
      else if (kind === "checked") { if (on) st.checked[key] = Date.now(); else delete st.checked[key]; }
      else { const s = new Set(st.rankChecked); on ? s.add(key) : s.delete(key); st.rankChecked = [...s]; }
      const res = await ghPutState(st, cur?.sha);
      if (res.ok) { setSyncText("共有に保存しました。"); return; }
      if (res.status !== 409 && res.status !== 422) throw new Error("書き込み " + res.status);
    }
    throw new Error("他の端末と重なりました");
  } catch (e) {
    setSyncText("共有に保存できませんでした（" + e.message + "）。この端末にだけ保存しています。", true);
  }
}

// 一覧に見えた出品は「最後に見えた時刻」を更新し、45日以上見えないチェックだけを消す（3つの CSV を全部読めたときだけ）
function refreshChecked(allRows) {
  const present = new Set(allRows.map(r => r["URL"]).filter(Boolean));
  const now = Date.now();
  const limit = CHECK_KEEP_DAYS * 24 * 3600 * 1000;
  let changed = false;
  for (const [url, seen] of [...checked]) {
    if (present.has(url)) {
      if (now - Number(seen) > 24 * 3600 * 1000) { checked.set(url, now); changed = true; }
    } else if (now - Number(seen) > limit) {
      checked.delete(url); changed = true;
    }
  }
  if (changed) writeChecked(checked);
}

// 一時的な失敗（混雑・通信の瞬断）で落ちないように、20秒で打ち切って、最大3回まで読み直す
async function fetchText(url) {
  let lastErr;
  for (let i = 0; i < 3; i++) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 20000);
    try {
      const r = await fetch(url, { cache: "no-store", signal: ctl.signal });
      if (!r.ok) throw new Error(r.status + " " + url);
      return await r.text();
    } catch (e) {
      lastErr = e.name === "AbortError" ? new Error("時間切れ " + url) : e;
      await new Promise(res => setTimeout(res, 800 * (i + 1)));
    } finally { clearTimeout(timer); }
  }
  throw lastErr;
}

async function load() {
  const linksPromise = fetchText(LINKS_URL).then(t => { links = JSON.parse(t); }).catch(() => { /* リンクの表が読めなくても、出品の表示は動く */ });
  const [ppText, mcText, snText] = await Promise.all(Object.values(SOURCES).map(fetchText));
  await linksPromise;
  const pp = parseCsv(ppText);
  const mc = parseCsv(mcText);
  const sn = parseCsv(snText);
  const all = [...pp, ...mc, ...sn];

  // カード名の統一：全角・半角の違いや空白を無視して同じカードとみなし、表示は PayPay の名前にそろえる
  const display = {};
  for (const r of pp) display[keyOf(r["カード"])] ??= r["カード"];
  for (const r of mc) display[keyOf(r["カード"])] ??= r["カード"];
  for (const r of sn) display[keyOf(r["カード"])] ??= r["カード"];
  for (const r of all) r["カード"] = display[keyOf(r["カード"])];

  // カードの並びは PayPay の順（番号順）。メルカリだけにあるものは後ろに足す。ピカチュウは一番下
  const names = [];
  for (const r of all) {
    if (!names.includes(r["カード"])) names.push(r["カード"]);
  }
  const held = "ピカチュウex";
  const ordered = names.filter(n => n !== held).concat(names.includes(held) ? [held] : []);

  data = { pp, mc, sn, ordered };
  render();
  // 共有の取り込みは表示のあとに行う（共有が遅くても、一覧の表示は待たせない）。変わっていたら描き直す
  const before = JSON.stringify(currentState());
  pullShared().then(() => {
    if (pp.length && mc.length && sn.length) refreshChecked(all);
    if (JSON.stringify(currentState()) !== before) render();
  });

  // タブで切り替える（ページは移動しない）：差額ランキング と カード別
  document.getElementById("tabs").hidden = false;
  document.querySelectorAll("#tabs .tab").forEach(btn => {
    btn.onclick = () => {
      currentTab = btn.dataset.tab;
      showTab();
      // 差額ランキングに切り替えたら、一番上から見せる
      if (currentTab === "ranking") window.scrollTo(0, 0);
    };
  });
}

// 除外中の出品を外して、最安値・差額・ランキングを計算し直す
function toggleListing(url) {
  if (excluded.has(url)) excluded.delete(url); else excluded.add(url);
  writeExcluded(excluded);
  pushShared("excluded", url, excluded.has(url));
  render();
}

// チェックを付ける・外す（最安値や順位は変わらないので、再計算せず表示だけ作り直す）
function toggleCheck(url) {
  if (checked.has(url)) checked.delete(url); else checked.set(url, Date.now());
  writeChecked(checked);
  pushShared("checked", url, checked.has(url));
  const top = window.scrollY;
  render();
  window.scrollTo(0, top);
}

function showTab() {
  const isRanking = currentTab === "ranking";
  document.getElementById("ranking").hidden = !isRanking;
  document.getElementById("card-list").hidden = isRanking;
  document.querySelectorAll("#tabs .tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === currentTab)));
}

function render() {
  const { pp, mc, sn, ordered } = data;
  const live = rows => rows.filter(r => !excluded.has(r["URL"]));
  const best = rows => {
    const nums = rows.map(r => r["価格"]).filter(v => /^\d+$/.test(v)).map(Number);
    return nums.length ? Math.min(...nums) : null;
  };

  const cardBlocks = [];
  const gaps = [];
  ordered.forEach((card, idx) => {
    const ppRows = pp.filter(r => r["カード"] === card).sort((a, b) => a["順位"] - b["順位"]);
    const mcRows = mc.filter(r => r["カード"] === card).sort((a, b) => a["順位"] - b["順位"]);
    const snRows = sn.filter(r => r["カード"] === card).sort((a, b) => a["順位"] - b["順位"]);
    const ppMin = best(live(ppRows));
    const mcMin = best(live(mcRows));
    const snMin = best(live(snRows));
    // 比べる相手は メルカリ と SNKRDUNK のうち、最安値が安い方（差額 = PayPay の最安 − その最安、符号つき）
    const others = [{ name: "メルカリ", min: mcMin }, { name: "SNKRDUNK", min: snMin }]
      .filter(o => o.min !== null);
    if (ppMin !== null && others.length > 0) {
      const o = others.reduce((a, b) => (b.min < a.min ? b : a));
      gaps.push({ card, idx: idx + 1, ppMin, otherName: o.name, otherMin: o.min, diff: ppMin - o.min });
    }
    const section = el("section", "card");
    section.id = "card-" + (idx + 1);
    section.appendChild(el("h2", null, "No." + (idx + 1) + " " + card));
    const grid = el("div", "sites");
    const lk = links[keyOf(card)] || {};
    grid.appendChild(siteBlock("PayPayフリマ", "paypay", ppRows, ppMin, excluded, toggleListing, lk.paypay));
    grid.appendChild(siteBlock("メルカリ", "mercari", mcRows, mcMin, excluded, toggleListing, lk.mercari));
    grid.appendChild(siteBlock("SNKRDUNK", "snkrdunk", snRows, snMin, excluded, toggleListing, lk.snkrdunk));
    section.appendChild(grid);
    cardBlocks.push(section);
  });

  // 差額の大きい順（プラスの大きい差額が上、マイナスは下へ）
  gaps.sort((a, b) => b.diff - a.diff);

  const rankingBox = el("div", null);
  rankingBox.id = "ranking";
  rankingBox.appendChild(rankingSection(gaps));
  const cardsBox = el("div", null);
  cardsBox.id = "card-list";
  const syncBar = document.getElementById("sync");
  syncBar.style.cssText = "font-size:13px;margin:0 0 12px;padding:8px 10px;border:1px solid var(--rule);border-radius:8px";
  cardsBox.appendChild(syncBar); // 共有の状態と「つなぐ」リンクは、カード別の一番上に出す
  cardBlocks.forEach(s => cardsBox.appendChild(s));

  const updated = (pp[0]?.["更新"] ?? "") + "（PayPay） / " + (mc[0]?.["更新"] ?? "") + "（メルカリ）";
  document.getElementById("updated").textContent = "結果の更新：" + updated + "。開いた時点で最新の CSV を読んでいます。";

  document.getElementById("cards").replaceChildren(rankingBox, cardsBox);
  showTab();
}

function showError(err) {
  const root = document.getElementById("cards");
  const btn = el("button", "tab", "もう一度読み込む");
  btn.type = "button";
  btn.onclick = () => location.reload();
  root.replaceChildren(el("p", "empty", "結果を読み込めませんでした（3回試しました）：" + err.message), btn);
}

// 【確認用・一時】パスワードを外している。戻すときは、この行と gate の hidden を消す（git revert でも戻せる）
document.getElementById("cards").hidden = false; document.getElementById("updated").hidden = false; load().catch(showError);
</script>
