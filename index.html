<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポケカ最安値比較</title>
<style>
:root {
  --bg: #f5f4f0; --paper: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --rule: #dcdad2;
  --paypay: #b84a12; --mercari: #0c6b63; --best: #1f7a3a; --gap: #9a2b2b;
  --sans: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --paper: #22221f; --ink: #ecebe6; --muted: #9c9a92; --rule: #3a3a35;
    --paypay: #f0875a; --mercari: #4fc3b5; --best: #6fd58c; --gap: #ef8a8a; color-scheme: dark;
  }
}
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 14px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
main { max-width: 880px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; text-wrap: balance; }
.lede { color: var(--muted); margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 14px 0 20px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.card { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
.card h2 { font-size: 16px; margin: 0 0 10px; }
.sites { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; min-width: 0; }
@media (max-width: 560px) { .sites { grid-template-columns: 1fr; gap: 10px; } }
.site { min-width: 0; }
.site-name { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; margin: 0 0 4px; }
.site.paypay .site-name { color: var(--paypay); }
.site.mercari .site-name { color: var(--mercari); }
ol { list-style: none; margin: 0; padding: 0; }
li { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; border-top: 1px dashed var(--rule); font-variant-numeric: tabular-nums; }
li:first-child { border-top: none; }
.rank { color: var(--muted); min-width: 2.6em; font-size: 12px; }
.thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; flex: none; background: var(--rule); }
.price { font-weight: 700; }
.price a { color: inherit; text-decoration: none; border-bottom: 1px solid currentColor; }
.best .price { color: var(--best); }
.best .price::after { content: " 最安"; font-size: 11px; font-weight: 700; margin-left: 4px; }
.empty { color: var(--muted); font-size: 13px; margin: 0; }
.photo-btn { margin-left: auto; font-size: 12px; padding: 2px 10px; border: 1px solid var(--mercari); color: var(--mercari); border-radius: 999px; text-decoration: none; white-space: nowrap; }
.gap-list { list-style: none; margin: 0; padding: 0; }
.gap-list li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 6px 0; border-top: 1px dashed var(--rule); }
.gap-list li:first-child { border-top: none; }
.gap-list a { color: var(--ink); font-weight: 700; text-decoration: none; }
.gap-list a:hover { text-decoration: underline; }
.gap-diff { color: var(--gap); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 6em; }
.tabs { display: flex; gap: 8px; margin: 0 0 14px; }
.tab { font: inherit; padding: 6px 14px; border: 1px solid var(--rule); border-radius: 999px; background: var(--paper); color: var(--ink); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.gap-detail { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
th, td { padding: 5px 6px; border-top: 1px dashed var(--rule); text-align: left; }
th { color: var(--muted); font-weight: 600; border-top: none; }
td.num, th.num { text-align: right; }
td.value { font-weight: 700; }
.table-wrap { overflow-x: auto; }
.sub { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
footer { margin-top: 20px; color: var(--muted); font-size: 12px; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>ポケカ最安値 PayPayとメルカリ</h1>
  </header>
  <nav id="tabs" class="tabs" hidden>
    <button type="button" class="tab" data-tab="ranking" aria-selected="true">差額ランキング</button>
    <button type="button" class="tab" data-tab="cards" aria-selected="false">カード別</button>
  </nav>
  <form id="gate" class="card">
    <label for="pw">パスワード</label>
    <p><input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit">開く</button></p>
    <p id="gate-msg" class="empty" hidden>パスワードが違います。</p>
  </form>
  <div id="cards" hidden><p class="empty">結果を読み込んでいます…</p></div>
</main>
<script>
// 簡易的な入口のパスワード（ハッシュだけを置く）。CSV は公開のままなので本当の保護ではない
const PW_HASH = "224948ca810fc2bc9e3d80c0b1129fe2487fa4e307961001ab8443db82f7bb69";

async function sha256hex(text) {
  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, "0")).join("");
}

document.getElementById("gate").addEventListener("submit", async e => {
  e.preventDefault();
  const input = document.getElementById("pw").value;
  if (await sha256hex(input) === PW_HASH) {
    document.getElementById("gate").hidden = true;
    document.getElementById("cards").hidden = false;
    load().catch(showError);
  } else {
    document.getElementById("gate-msg").hidden = false;
  }
});

// 定期実行が commit する CSV と、時価総額の CSV を、開いたときに読みにいく
const SOURCES = {
  paypay: "https://raw.githubusercontent.com/shete0804/paypayfleamarket-price-tracker/main/results/paypay.csv",
  mercari: "https://raw.githubusercontent.com/shete0804/mercari-scraper/main/results/mercari.csv",
};

function parseCsv(text) {
  const lines = text.trim().split(/\r?\n/);
  const header = lines.shift().split(",");
  return lines.map(line => {
    const cells = line.split(",");
    const row = {};
    header.forEach((h, i) => { row[h] = cells[i] ?? ""; });
    return row;
  });
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function siteBlock(name, cls, rows, cheapest) {
  const box = el("div", "site " + cls);
  box.appendChild(el("p", "site-name", name));
  const valid = rows.filter(r => /^\d+$/.test(r["価格"]));
  if (valid.length === 0) {
    box.appendChild(el("p", "empty", rows.length ? rows[0]["価格"] : "該当なし"));
    return box;
  }
  const list = el("ol");
  for (const r of valid) {
    const price = Number(r["価格"]);
    const li = el("li");
    if (price === cheapest) li.className = "best";
    if (r["写真"]) {
      const img = el("img");
      img.src = r["写真"];
      img.alt = "";
      img.loading = "lazy";
      img.width = 56;
      img.height = 56;
      img.className = "thumb";
      li.appendChild(img);
    }
    li.appendChild(el("span", "rank", r["順位"] + "位"));
    const span = el("span", "price");
    const a = el("a", null, "¥" + price.toLocaleString("ja-JP"));
    a.href = r["URL"];
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    span.appendChild(a);
    li.appendChild(span);
    list.appendChild(li);
  }
  box.appendChild(list);
  return box;
}

const yen = n => "¥" + Math.round(n).toLocaleString("ja-JP");

// 差額ランキング：PayPay の最安と メルカリ の最安の差（絶対値の円）が大きい順
function rankingSection(gaps) {
  const section = el("section", "card");
  const list = el("ol", "gap-list");
  for (const g of gaps) {
    const li = el("li");
    li.appendChild(el("span", "gap-diff", yen(g.diff)));
    const a = el("a", null, g.card);
    a.href = "#card-" + g.idx;
    li.appendChild(a);
    li.appendChild(el("span", "gap-detail", "PayPay " + yen(g.ppMin) + " ／ メルカリ " + yen(g.mcMin)));
    list.appendChild(li);
  }
  section.appendChild(list);
  return section;
}

async function load() {
  const [ppText, mcText] = await Promise.all(
    Object.values(SOURCES).map(url => fetch(url, { cache: "no-store" }).then(r => {
      if (!r.ok) throw new Error(r.status + " " + url);
      return r.text();
    }))
  );
  const pp = parseCsv(ppText);
  const mc = parseCsv(mcText);

  // カード名の統一：全角・半角の違いや空白を無視して同じカードとみなし、表示は PayPay の名前にそろえる
  const keyOf = s => s.replace(/＆/g, "&").replace(/[\s　]/g, "").toLowerCase();
  const display = {};
  for (const r of pp) display[keyOf(r["カード"])] ??= r["カード"];
  for (const r of mc) display[keyOf(r["カード"])] ??= r["カード"];
  for (const r of [...pp, ...mc]) r["カード"] = display[keyOf(r["カード"])];

  // カードの並びは PayPay の順（番号順）。メルカリだけにあるものは後ろに足す。ピカチュウは一番下
  const names = [];
  for (const r of [...pp, ...mc]) {
    if (!names.includes(r["カード"])) names.push(r["カード"]);
  }
  const held = "ピカチュウex";
  const ordered = names.filter(n => n !== held).concat(names.includes(held) ? [held] : []);

  const best = rows => {
    const nums = rows.map(r => r["価格"]).filter(v => /^\d+$/.test(v)).map(Number);
    return nums.length ? Math.min(...nums) : null;
  };

  const cardBlocks = [];
  const gaps = [];
  ordered.forEach((card, idx) => {
    const ppRows = pp.filter(r => r["カード"] === card).sort((a, b) => a["順位"] - b["順位"]);
    const mcRows = mc.filter(r => r["カード"] === card).sort((a, b) => a["順位"] - b["順位"]);
    const ppMin = best(ppRows);
    const mcMin = best(mcRows);
    if (ppMin !== null && mcMin !== null) {
      const diff = Math.abs(ppMin - mcMin);
      gaps.push({ card, idx: idx + 1, ppMin, mcMin, diff, pct: diff / Math.min(ppMin, mcMin) });
    }
    const section = el("section", "card");
    section.id = "card-" + (idx + 1);
    section.appendChild(el("h2", null, "No." + (idx + 1) + " " + card));
    const grid = el("div", "sites");
    grid.appendChild(siteBlock("PayPayフリマ", "paypay", ppRows, ppMin));
    grid.appendChild(siteBlock("メルカリ", "mercari", mcRows, mcMin));
    section.appendChild(grid);
    cardBlocks.push(section);
  });

  gaps.sort((a, b) => b.diff - a.diff);

  // タブで切り替える（ページは移動しない）：差額ランキング と カード別
  const rankingBox = el("div", null);
  rankingBox.id = "ranking";
  rankingBox.appendChild(rankingSection(gaps));
  const cardsBox = el("div", null);
  cardsBox.id = "card-list";
  cardsBox.hidden = true;
  cardBlocks.forEach(s => cardsBox.appendChild(s));

  const root = document.getElementById("cards");
  root.replaceChildren(rankingBox, cardsBox);
  document.getElementById("tabs").hidden = false;
  document.querySelectorAll("#tabs .tab").forEach(btn => {
    btn.addEventListener("click", () => {
      const isRanking = btn.dataset.tab === "ranking";
      rankingBox.hidden = !isRanking;
      cardsBox.hidden = isRanking;
      document.querySelectorAll("#tabs .tab").forEach(b => b.setAttribute("aria-selected", String(b === btn)));
    });
  });
}

function showError(err) {
  const root = document.getElementById("cards");
  root.replaceChildren(el("p", "empty", "結果を読み込めませんでした：" + err.message));
}
</script>
</body>
</html>
